<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0b" />
    <meta name="description" content="A minimal, reusable first-person controller foundation." />
    <title>FPS Foundation</title>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="First-person test scene"></div>
      <header class="hud">
        <div class="hud-brand">FPS FOUNDATION <span> / CONTROLLER TEST</span></div>
        <div class="hud-status" id="coordinates">X 0.00 · Z 0.00</div>
      </header>
      <div class="crosshair" aria-hidden="true"></div>
      <div class="hint" id="hint">WASD move · SHIFT run · SPACE jump · MOUSE look · E interact · ESC pause</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <section class="pause-screen" id="pauseScreen" hidden>
        <div class="pause-panel">
          <div class="eyebrow">SYSTEM / PAUSED</div>
          <h1>PAUSED<span>_</span></h1>
          <p>Movement input is suspended.</p>
          <button id="resumeButton" type="button">RESUME</button>
          <small>ESC / ENTER TO CONTINUE</small>
        </div>
      </section>
      <section class="touch-ui" id="touchUI" aria-label="Touch controls">
        <div class="move-stick" id="moveStick" aria-label="Movement joystick">
          <div class="stick-ring"></div>
          <div class="stick-knob" id="moveKnob"></div>
        </div>
        <div class="look-zone" id="touchLookZone" aria-label="Drag to look"></div>
        <div class="touch-actions">
          <button type="button" data-touch-action="jump">JUMP</button>
          <button type="button" data-touch-action="run">RUN</button>
          <button type="button" data-touch-action="interact">E</button>
          <button type="button" data-touch-action="pause">Ⅱ</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
