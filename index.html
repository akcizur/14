<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a8b8bf" />
    <meta name="description" content="Severní čtvrť — low-poly obytný svět a samostatný first-person controller." />
    <title>Severní čtvrť / FPS World</title>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="První osoba — obytná čtvrť"></div>
      <header class="hud">
        <div class="hud-brand">SEVERNÍ ČTVRŤ <span> / RESIDENTIAL DISTRICT</span></div>
        <div class="hud-status" id="coordinates">X 0.0 · Z 0.0</div>
      </header>
      <div class="crosshair" aria-hidden="true"></div>
      <div class="hint" id="hint">WASD POHYB · SHIFT BĚH · SPACE SKOK · MYŠ POHLED · E INTERAKCE · ESC PAUZA</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <section class="pause-screen" id="pauseScreen" hidden>
        <div class="pause-panel">
          <div class="eyebrow">SYSTEM / PAUSED</div>
          <h1>PAUSED<span>_</span></h1>
          <p>Pohyb je pozastaven.</p>
          <button id="resumeButton" type="button">POKRAČOVAT</button>
          <small>ESC / ENTER TO CONTINUE</small>
        </div>
      </section>
      <section class="touch-ui" id="touchUI" aria-label="Dotykové ovládání">
        <div class="move-stick" id="moveStick" aria-label="Joystick pohybu">
          <div class="stick-ring"></div>
          <div class="stick-knob" id="moveKnob"></div>
        </div>
        <div class="look-zone" id="touchLookZone" aria-label="Tažením otáčej pohled"></div>
        <div class="touch-actions">
          <button type="button" data-touch-action="jump">SKOK</button>
          <button type="button" data-touch-action="run">BĚH</button>
          <button type="button" data-touch-action="interact">E</button>
          <button type="button" data-touch-action="pause">Ⅱ</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
